<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<style>
    body {
        background-color: #f8f9fa;
    }

    canvas {
        width: 100% !important;
        height: auto !important;
    }
    .sidebar {
        background-color: #343a40;
        color: white;
        padding: 36px;
        transition: width 0.3s, padding 0.3s;
        width: 200px;
        min-height: 100vh
    }
    .sidebar a {
        color: white;
        text-decoration: none;
    }
    .sidebar a:hover {
        background-color: #343a40;
        color: white;
    }
    .main-content {
        flex: 1; /* Allow main content to grow */
        transition: margin-left 0.3s; /* Smooth transition */
    }

    /* Center main content when sidebar is hidden */
    .sidebar.hidden {
        width: 60px; /* Reduced width for icons only */
        padding: 0; /* Remove padding */
        overflow: hidden; /* Hide overflow */
    }

    .sidebar.hidden ~ .main-content {
        margin-left: 0; /* Center main content when sidebar is hidden */
    }

    .sidebar a {
        display: flex;
        align-items: center; /* Center align icon */
    }

    .sidebar a span {
        margin-left: 10px; /* Space between icon and text */
    }

    .sidebar.hidden a span {
        display: none; /* Hide text when sidebar is hidden */
    }

    /* Optional: Adjust icon size for a better look */
    .sidebar a svg {
        width: 24px; /* Set a fixed size for icons */
        height: 24px;
    }

    @media (max-width: 768px) {
        .sidebar {
            width: 100%; /* Full width on mobile */
            position: fixed; /* Make it fixed */
            z-index: 1000; /* Ensure it appears above other content */
            min-height: 100%;
        }
        .main-content {
            margin-left: 100px; /* No margin when sidebar is full width */
        }

    }
</style>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar" id="sidebar">
            <button class="bg-transparent" id="toggleButton">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left text-white" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                </svg>
                <span id="toggleButtonText" class="text-white">Sembunyikan Menu</span>
            </button>
            <a href="/" class="d-flex align-items-center mb-3 text-decoration-none mt-4">
                <span class="fs-4">Navigate</span>
            </a>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link active "><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house" viewBox="0 0 16 16">
                        <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/>
                    </svg><span class="m-2">Home</span></a>
                    <a href="barang.html" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-seam" viewBox="0 0 16 16">
                            <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
                        </svg><span class="m-2">Management Barang</span></a>
                    <a href="transaksi.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-basket" viewBox="0 0 16 16">
                        <path d="M5.757 1.071a.5.5 0 0 1 .172.686L3.383 6h9.234L10.07 1.757a.5.5 0 1 1 .858-.514L13.783 6H15a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1v4.5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 1 13.5V9a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h1.217L5.07 1.243a.5.5 0 0 1 .686-.172zM2 9v4.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V9zM1 7v1h14V7zm3 3a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3A.5.5 0 0 1 4 10m2 0a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3A.5.5 0 0 1 6 10m2 0a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3A.5.5 0 0 1 8 10m2 0a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3a.5.5 0 0 1 .5-.5m2 0a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3a.5.5 0 0 1 .5-.5"/>
                    </svg><span class="m-2">Transaksi</span></a>
                    <a href="/supplier.html" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-truck" viewBox="0 0 16 16">
                            <path d="M0 3.5A1.5 1.5 0 0 1 1.5 2h9A1.5 1.5 0 0 1 12 3.5V5h1.02a1.5 1.5 0 0 1 1.17.563l1.481 1.85a1.5 1.5 0 0 1 .329.938V10.5a1.5 1.5 0 0 1-1.5 1.5H14a2 2 0 1 1-4 0H5a2 2 0 1 1-3.998-.085A1.5 1.5 0 0 1 0 10.5zm1.294 7.456A2 2 0 0 1 4.732 11h5.536a2 2 0 0 1 .732-.732V3.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 .294.456M12 10a2 2 0 0 1 1.732 1h.768a.5.5 0 0 0 .5-.5V8.35a.5.5 0 0 0-.11-.312l-1.48-1.85A.5.5 0 0 0 13.02 6H12zm-9 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m9 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2"/>
                        </svg>
                        <span class="m-2">Supplier</span>
                    </a>
                    <a href="laporan.html" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-envelope-paper" viewBox="0 0 16 16">
                            <path d="M4 0a2 2 0 0 0-2 2v1.133l-.941.502A2 2 0 0 0 0 5.4V14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5.4a2 2 0 0 0-1.059-1.765L14 3.133V2a2 2 0 0 0-2-2zm10 4.267.47.25A1 1 0 0 1 15 5.4v.817l-1 .6zm-1 3.15-3.75 2.25L8 8.917l-1.25.75L3 7.417V2a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1zm-11-.6-1-.6V5.4a1 1 0 0 1 .53-.882L2 4.267zm13 .566v5.734l-4.778-2.867zm-.035 6.88A1 1 0 0 1 14 15H2a1 1 0 0 1-.965-.738L8 10.083zM1 13.116V7.383l4.778 2.867L1 13.117Z"/>
                        </svg>
                        <span class="m-2">Laporan</span></a>
                    <a href="user.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                    </svg><span class="m-2">User</span></a>
                </li>
            </ul>
            <hr>
            <a  href="login.html" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-dash-fill" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M11 7.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5"/>
                    <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                </svg>
                <span class="m-2">Logout</span>
            </a>
        </nav>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-4 main-content">
            <div class="container mt-5">
                <h3 class="text-center mb-4">Transaksi</h3>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <button class="btn bg-primary text-white rounded mx-3" style="cursor: pointer; font-size: 0.7rem" id="tambah_transaksi">Tambah </button>
                    <form id="searchForm" class="d-flex" style="width: 300px;">
                        <input type="search" id="keyword" class="form-control me-2" placeholder="Cari Supplier..." aria-label="Search">
                        <button type="submit" class="btn btn-outline-primary">Search</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">
                        Daftar Supplier
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <thead>
                                <tr>
                                    <th>Tanggal Transaksi</th>
                                    <th>Jenis Transaksi</th>
                                    <th>Nama Barang</th>
                                    <th>Total</th>
                                    <th>Supplier</th>
                                </tr>
                                </thead>
                                <tbody id="transaksiList">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="editModalLabel">Edit Transaksi</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">
                            <form id="editForm">
                                <div class="mb-3">
                                    <label for="barangSelect" class="form-label">Pilih Barang</label>
                                    <select id="barangSelect" class="form-select" required>
                                        <option value="" disabled selected>Select Barang</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="supplierSelect" class="form-label">Pilih Supplier</label>
                                    <select id="supplierSelect" class="form-select" required>
                                        <option value="" disabled selected>Select Supplier</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="editDateTransaksi" class="form-label">Tanggal Transaksi</label>
                                    <input type="date" class="form-control" id="editDateTransaksi" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editTypeTransaksi" class="form-label">Tipe </label>
                                    <select id="editTypeTransaksi" class="form-select" required>
                                        <option value="" disabled selected>Select Tipe</option>
                                        <option value="masuk">Masuk</option>
                                        <option value="keluar">Keluar</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="editTotal" class="form-label">Total</label>
                                    <input type="number" class="form-control" id="editTotal" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main >
    </div>
</div>
<script src="./bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
<script>
    var barang = document.getElementById("barang");
    if (barang) {
        barang.addEventListener("click", () => window.location.href = "barang.html");
    }
    var transaksi = document.getElementById("transaksi");
    if (transaksi) {
        transaksi.addEventListener("click", () => window.location.href = "transaksi.html");
    }
    var supplier = document.getElementById("supplier");
    if (supplier) {
        supplier.addEventListener("click", () => window.location.href = "supplier.html");
    }
    var laporan = document.getElementById("laporan");
    if (laporan) {
        laporan.addEventListener("click", () => window.location.href = "laporan.html");
    }
    var user = document.getElementById("user");
    if (user) {
        user.addEventListener("click", () => window.location.href = "user.html");
    }

    document.getElementById('toggleButton').addEventListener('click', function() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const toggleButtonText = document.getElementById('toggleButtonText');
        const toggleButton = document.getElementById("toggleButton")
        sidebar.classList.toggle('hidden');

        if (sidebar.classList.contains('hidden')) {
            toggleButton.style.marginTop = "20px"
            toggleButtonText.innerText = '';
        } else {
            toggleButtonText.innerText = 'Sembunyikan Menu';
        }

        if (sidebar.classList.contains('hidden')) {
            mainContent.style.marginLeft = '0';
        } else {
            mainContent.style.marginLeft = '250px';
        }
    });

    var token = localStorage.getItem("jwtToken");
    if(!token){
        window.location.href = "login.html"
    }
    function fetchBarang() {
        fetch("http://localhost:8080/api/barang", {
            method: 'GET',
            headers:{
                "Authorization": `Bearer ${token}`
            }
        }).then(response => response.json())
            .then(data => {
                const barangSelect = document.getElementById("barangSelect");
                data.data.forEach(item => {
                    let option = document.createElement("option");
                    option.value = item.id;
                    option.textContent = item.name;
                    barangSelect.appendChild(option);
                });
            }).catch(error => {
                window.location.href = "401.html"
                console.error('Error fetching Barang:', error)
            });
    }

    function fetchSupplier() {
        fetch("http://localhost:8080/api/supplier", {
            method: 'GET',
            headers:{
                "Authorization": `Bearer ${token}`
            }
        }).then(response => response.json())
            .then(data => {
                const supplierSelect = document.getElementById("supplierSelect");
                data.data.forEach(item => {
                    let option = document.createElement("option");
                    option.value = item.id;
                    option.textContent = item.name;
                    supplierSelect.appendChild(option);
                });
            }).catch(error => console.error('Error fetching Supplier:', error));
    }

    fetchBarang()
    fetchSupplier()
    document.getElementById("tambah_transaksi").addEventListener("click", function () {
        clearEditForm();
        document.getElementById("editForm").removeAttribute("data-id");
        var editModal = new bootstrap.Modal(document.getElementById('editModal'));
        editModal.show();
    });

    function clearEditForm() {
        document.getElementById("barangSelect").value = "";
        document.getElementById("supplierSelect").value = "";
        document.getElementById("editDateTransaksi").value = "";
        document.getElementById("editTypeTransaksi").value = "";
        document.getElementById("editTotal").value = "";
    }

    document.getElementById("editForm").addEventListener("submit", function (e) {
        e.preventDefault();


        var id = this.getAttribute("data-id");
        var barangId = document.getElementById("barangSelect").value;
        var supplierId = document.getElementById("supplierSelect").value;
        var date = document.getElementById("editDateTransaksi").value;
        var dateObj = new Date(date)
        var epochTime = Math.floor(dateObj.getTime()/1000)
        var type = document.getElementById("editTypeTransaksi").value;
        var total = document.getElementById("editTotal").value;
        date = epochTime

        if (id) {
            fetchUpdate(id, { name, barangId, supplierId, date, type,total });
        } else {
            if(type === "masuk"){
                fetchAddIn({ name, barangId, supplierId, date, type,total })
            }else{
                fetchAddOut({ name, barangId, supplierId, date, type,total })
            }
        }
    });

    function fetchUpdate(id, data) {
        fetch(`http://localhost:8080/api/transaksi/${id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(data)
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            console.log('Item updated successfully:', data);
            fetchAll();
            var editModal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
            editModal.hide();
        }).catch(error => {
            console.error('Error updating item:', error);
            alert('Error updating item. Please try again.');
        });
    }

    function fetchAddIn(data) {
        fetch(`http://localhost:8080/api/transaksi/in`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(data)
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            console.log('Item added successfully:', data);
            fetchAll();
            var editModal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
            editModal.hide();
        }).catch(error => {
            console.error('Error adding item:', error);
            alert('Error adding item. Please try again.');
        });
    }

    function fetchAddOut(data) {
        fetch(`http://localhost:8080/api/transaksi/out`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(data)
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            console.log('Item added successfully:', data);
            fetchAll();
            var editModal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
            editModal.hide();
        }).catch(error => {
            console.error('Error adding item:', error);
            alert('Error adding item. Please try again.');
        });
    }

    function fetchAll() {
        fetch("http://localhost:8080/api/transaksi", {
            method: 'GET',
            headers:{
                "Authorization": `Bearer ${token}`
            }
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            updateTransaksiList(data.data);
        }).catch(error => {
            console.error('There was a problem with the fetch operation:', error);
        });
    }
    fetchAll()
    function updateTransaksiList(items) {
        const transaksiList = document.getElementById("transaksiList");
        transaksiList.innerHTML = "";

        items.forEach(item => {
            date = new Date(item.date * 1000).toLocaleDateString()
            let supplierName = item.supplier ? item.supplier.name : 'User';

            let newRow = `<tr>
                <td>${date}</td>
                <td>${item.type}</td>
                <td>${item.barang.name}</td>
                <td>${item.total}</td>
                <td>${supplierName}</td>
                <td>
                    <button class="btn btn-warning btn-sm editBtn" data-id="${item.id}" data-bs-toggle="modal">Edit</button>
                    <button class="btn btn-danger btn-sm deleteBtn" data-id="${item.id}">Delete</button>
                </td>
            </tr>`;
            transaksiList.innerHTML += newRow;
        })


        document.querySelectorAll('.editBtn').forEach(button => {
            button.addEventListener('click', function() {
                const itemId = this.getAttribute('data-id');
                fetchItemForEdit(itemId);
            });
        });

        document.querySelectorAll('.deleteBtn').forEach(button => {
            button.addEventListener('click', function() {
                const itemId = this.getAttribute('data-id');
                fetchDelete(itemId);
            });
        });
    }

    function fetchItemForEdit(id) {
        fetch(`http://localhost:8080/api/transaksi/${id}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            }
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            const item = data.data;

            document.getElementById("barangSelect").value = item.barang.id;
            document.getElementById("supplierSelect").value = item.supplier ? item.supplier.id : "";

            const date = new Date(item.date * 1000);
            const formattedDate = date.toISOString().split('T')[0];
            document.getElementById("editDateTransaksi").value = formattedDate;

            document.getElementById("editTypeTransaksi").value = item.type;
            document.getElementById("editTotal").value = item.total;

            document.getElementById("editForm").setAttribute("data-id", id);

            var editModal = new bootstrap.Modal(document.getElementById('editModal'));
            editModal.show();
        }).catch(error => {
            console.error("Error fetching item for edit:", error);
        });
    }

    function fetchDelete(id) {
        fetch(`http://localhost:8080/api/transaksi/${id}`, {
            method: "DELETE",
            headers:{
                "Authorization": `Bearer ${token}`
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                console.log('Item deleted successfully:', data);
                fetchAll();
            })
            .catch(err => {
                console.error("Error ", err);
            });
    }

    document.getElementById("searchForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const keyword = document.getElementById("keyword").value;
        fetchSearch(keyword);
    });

    function fetchSearch(keyword) {
        fetch(`http://localhost:8080/api/transaksi/search?keyword=${encodeURIComponent(keyword)}`, {
            method: 'GET',
            headers:{
                "Authorization": `Bearer ${token}`
            }
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            updateTransaksiList(data.data);
        }).catch(error => {
            console.error('There was a problem with the fetch operation:', error);
        });
    }
</script>
</body>
</html>
