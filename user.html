<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link rel="stylesheet" href="./bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<style>
    body {
        background-color: #f8f9fa;
    }

    canvas {
        width: 100% !important;
        height: auto !important;
    }
    .sidebar {
        background-color: #343a40;
        color: white;
        padding: 36px;
        transition: width 0.3s, padding 0.3s;
        width: 200px; /* Fixed width for the sidebar */
        min-height: 100vh;
    }
    .sidebar a {
        color: white;
        text-decoration: none;
    }
    .sidebar a:hover {
        background-color: #343a40;
        color: white;
    }
    .main-content {
        flex: 1; /* Allow main content to grow */
        transition: margin-left 0.3s; /* Smooth transition */
    }

    /* Center main content when sidebar is hidden */
    .sidebar.hidden {
        width: 60px; /* Reduced width for icons only */
        padding: 0; /* Remove padding */
        overflow: hidden; /* Hide overflow */
    }

    .sidebar.hidden ~ .main-content {
        margin-left: 0; /* Center main content when sidebar is hidden */
    }

    .sidebar a {
        display: flex;
        align-items: center; /* Center align icon */
    }

    .sidebar a span {
        margin-left: 10px; /* Space between icon and text */
    }

    .sidebar.hidden a span {
        display: none; /* Hide text when sidebar is hidden */
    }

    /* Optional: Adjust icon size for a better look */
    .sidebar a svg {
        width: 24px; /* Set a fixed size for icons */
        height: 24px;
    }
</style>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar" id="sidebar">
            <button class="bg-transparent" id="toggleButton">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left text-white" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                </svg>
                <span id="toggleButtonText" class="text-white">Sembunyikan Menu</span>
            </button>
            <a href="/" class="d-flex align-items-center mb-3 text-decoration-none mt-4">
                <span class="fs-4">Navigate</span>
            </a>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link active "><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house" viewBox="0 0 16 16">
                        <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/>
                    </svg><span class="m-2">Home</span></a>
                    <a href="barang.html" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-seam" viewBox="0 0 16 16">
                            <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
                        </svg><span class="m-2">Management Barang</span></a>
                    <a href="transaksi.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-basket" viewBox="0 0 16 16">
                        <path d="M5.757 1.071a.5.5 0 0 1 .172.686L3.383 6h9.234L10.07 1.757a.5.5 0 1 1 .858-.514L13.783 6H15a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1v4.5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 1 13.5V9a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h1.217L5.07 1.243a.5.5 0 0 1 .686-.172zM2 9v4.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V9zM1 7v1h14V7zm3 3a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3A.5.5 0 0 1 4 10m2 0a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3A.5.5 0 0 1 6 10m2 0a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3A.5.5 0 0 1 8 10m2 0a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3a.5.5 0 0 1 .5-.5m2 0a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3a.5.5 0 0 1 .5-.5"/>
                    </svg><span class="m-2">Transaksi</span></a>
                    <a href="/supplier.html" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-truck" viewBox="0 0 16 16">
                            <path d="M0 3.5A1.5 1.5 0 0 1 1.5 2h9A1.5 1.5 0 0 1 12 3.5V5h1.02a1.5 1.5 0 0 1 1.17.563l1.481 1.85a1.5 1.5 0 0 1 .329.938V10.5a1.5 1.5 0 0 1-1.5 1.5H14a2 2 0 1 1-4 0H5a2 2 0 1 1-3.998-.085A1.5 1.5 0 0 1 0 10.5zm1.294 7.456A2 2 0 0 1 4.732 11h5.536a2 2 0 0 1 .732-.732V3.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 .294.456M12 10a2 2 0 0 1 1.732 1h.768a.5.5 0 0 0 .5-.5V8.35a.5.5 0 0 0-.11-.312l-1.48-1.85A.5.5 0 0 0 13.02 6H12zm-9 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m9 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2"/>
                        </svg>
                        <span class="m-2">Supplier</span>
                    </a>
                    <a href="laporan.html" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-envelope-paper" viewBox="0 0 16 16">
                            <path d="M4 0a2 2 0 0 0-2 2v1.133l-.941.502A2 2 0 0 0 0 5.4V14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5.4a2 2 0 0 0-1.059-1.765L14 3.133V2a2 2 0 0 0-2-2zm10 4.267.47.25A1 1 0 0 1 15 5.4v.817l-1 .6zm-1 3.15-3.75 2.25L8 8.917l-1.25.75L3 7.417V2a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1zm-11-.6-1-.6V5.4a1 1 0 0 1 .53-.882L2 4.267zm13 .566v5.734l-4.778-2.867zm-.035 6.88A1 1 0 0 1 14 15H2a1 1 0 0 1-.965-.738L8 10.083zM1 13.116V7.383l4.778 2.867L1 13.117Z"/>
                        </svg>
                        <span class="m-2">Laporan</span></a>
                    <a href="user.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                    </svg><span class="m-2">User</span></a>
                </li>
            </ul>
            <hr>
            <a  href="login.html" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-dash-fill" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M11 7.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5"/>
                    <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                </svg>
                <span class="m-2">Logout</span>
            </a>
        </nav>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-4 main-content">
            <div class="container mt-5">
                <h3 class="text-center mb-4">User Management</h3>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <button class="btn bg-primary text-white rounded mx-3" style="cursor: pointer; font-size: 0.7rem" id="tambah_user">Tambah User</button>
                    <form id="searchForm" class="d-flex" style="width: 300px;">
                        <input type="search" id="keyword" class="form-control me-2" placeholder="Cari User..." aria-label="Search">
                        <button type="submit" class="btn btn-outline-primary">Search</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">
                        Daftar User
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Role</th>
                                    <th>Aksi</th>
                                </tr>
                                </thead>
                                <tbody id="userList">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="addModalLabel">Tambah User</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="addForm">
                                <div class="mb-3">
                                    <label for="addUsernameUser" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="addUsernameUser" required>
                                </div>
                                <div class="mb-3">
                                    <label for="addRoleUser" class="form-label">Role</label>
                                    <select id="addRoleUser" class="form-select" required>
                                        <option value="" disabled selected>Select Role</option>
                                        <option value="admin">Admin</option>
                                        <option value="operator">Operator</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="addPasswordUser" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="addPasswordUser" required>
                                </div>
                                <div class="mb-3">
                                    <label for="addTryPasswordUser" class="form-label">Konfirmasi Password</label>
                                    <input type="password" class="form-control" id="addTryPasswordUser" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Tambah User</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Edit User -->
            <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="editModalLabel">Edit User</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="editForm">
                                <div class="mb-3">
                                    <label for="editUsernameUser" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="editUsernameUser" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editOldPasswordUser" class="form-label">Password Lama</label>
                                    <input type="password" class="form-control" id="editOldPasswordUser" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editNewPasswordUser" class="form-label">Password Baru</label>
                                    <input type="password" class="form-control" id="editNewPasswordUser" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editTryNewPasswordUser" class="form-label">Konfirmasi Password Baru</label>
                                    <input type="password" class="form-control" id="editTryNewPasswordUser" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>
<script src="./bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
<script>

    var barang = document.getElementById("barang");
    if (barang) {
        barang.addEventListener("click", () => window.location.href = "barang.html");
    }
    var transaksi = document.getElementById("transaksi");
    if (transaksi) {
        transaksi.addEventListener("click", () => window.location.href = "transaksi.html");
    }
    var supplier = document.getElementById("supplier");
    if (supplier) {
        supplier.addEventListener("click", () => window.location.href = "supplier.html");
    }
    var laporan = document.getElementById("laporan");
    if (laporan) {
        laporan.addEventListener("click", () => window.location.href = "laporan.html");
    }
    var user = document.getElementById("user");
    if (user) {
        user.addEventListener("click", () => window.location.href = "user.html");
    }

    document.getElementById('toggleButton').addEventListener('click', function() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const toggleButtonText = document.getElementById('toggleButtonText');
        const toggleButton = document.getElementById("toggleButton")
        sidebar.classList.toggle('hidden');

        if (sidebar.classList.contains('hidden')) {
            toggleButton.style.marginTop = "20px"
            toggleButtonText.innerText = '';
        } else {
            toggleButtonText.innerText = 'Sembunyikan Menu';
        }

        if (sidebar.classList.contains('hidden')) {
            mainContent.style.marginLeft = '0';
        } else {
            mainContent.style.marginLeft = '250px';
        }
    });

    var token = localStorage.getItem("jwtToken");
    if(!token){
        window.location.href = "login.html";
    }
    document.getElementById("tambah_user").addEventListener("click", function () {
        clearAddForm();
        var addModal = new bootstrap.Modal(document.getElementById('addModal'));
        addModal.show();
    });

    document.querySelectorAll('.editBtn').forEach(button => {
        button.addEventListener('click', function() {
            const itemId = this.getAttribute('data-id');
            fetchItemForEdit(itemId);
        });
    });

    function clearAddForm() {
        document.getElementById("addUsernameUser").value = "";
        document.getElementById("addRoleUser").value = "";
        document.getElementById("addPasswordUser").value = "";
        document.getElementById("addTryPasswordUser").value = "";
    }

    document.getElementById("addForm").addEventListener("submit", function (e) {
        e.preventDefault();

        var username = document.getElementById("addUsernameUser").value;
        var password = document.getElementById("addPasswordUser").value;
        var tryPassword = document.getElementById("addTryPasswordUser").value;
        var role = document.getElementById("addRoleUser").value;

        if(password !== tryPassword){
            alert("Password dan Konfirmasi Password tidak cocok");
            return;
        }

        fetchAdd({ username, password, role });
    });

    document.getElementById("editForm").addEventListener("submit", function (e) {
        e.preventDefault();

        var id = this.getAttribute("data-id");
        var username = document.getElementById("editUsernameUser").value;
        var oldPassword = document.getElementById("editOldPasswordUser").value;
        var password = document.getElementById("editNewPasswordUser").value;
        var tryNewPassword = document.getElementById("editTryNewPasswordUser").value;

        if(password !== tryNewPassword){
            alert("Password baru dan konfirmasi password tidak cocok!");
            return;
        }

        fetchUpdate(id, { username, oldPassword, password });
    });

    function fetchAdd(data) {
        fetch(`http://localhost:8080/api/user/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(data)
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            console.log('User added successfully:', data);
            fetchAll();
            var addModal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
            addModal.hide();
        }).catch(error => {
            console.error('Error adding user:', error);
            alert('Error adding user. Please try again.');
        });
    }

    function fetchUpdate(id, data) {
        fetch(`http://localhost:8080/api/users/${id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(data)
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            console.log('User updated successfully:', data);
            fetchAll();
            var editModal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
            editModal.hide();
        }).catch(error => {
            console.error('Error updating user:', error);
            alert('Error updating user. Please try again.');
        });
    }

    function fetchAll() {
        fetch("http://localhost:8080/api/users", {
            method: 'GET',
            headers:{
                "Authorization": `Bearer ${token}`
            }
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            updateUserList(data.data);
        }).catch(error => {
            window.location.href = "401.html"
            console.error('There was a problem with the fetch operation:', error);
        });
    }

    document.getElementById("searchForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const keyword = document.getElementById("keyword").value;
        fetchSearch(keyword);
    });

    function fetchSearch(keyword) {
        fetch(`http://localhost:8080/api/users/search?keyword=${encodeURIComponent(keyword)}`, {
            method: 'GET',
            headers:{
                "Authorization": `Bearer ${token}`
            }
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            updateUserList(data.data);
        }).catch(error => {
            console.error('There was a problem with the fetch operation:', error);
        });
    }

    function updateUserList(items) {
        const userList = document.getElementById("userList");
        userList.innerHTML = "";

        items.forEach(item => {
            let newRow = `<tr>
                <td>${item.username}</td>
                <td>${item.role}</td>
                <td>
                    <button class="btn btn-warning btn-sm editBtn" data-id="${item.id}">Edit</button>
                    <button class="btn btn-danger btn-sm deleteBtn" data-id="${item.id}">Delete</button>
                </td>
            </tr>`;
            userList.innerHTML += newRow;
        });

        document.querySelectorAll('.editBtn').forEach(button => {
            button.addEventListener('click', function() {
                const itemId = this.getAttribute('data-id');
                fetchItemForEdit(itemId);
            });
        });

        document.querySelectorAll('.deleteBtn').forEach(button => {
            button.addEventListener('click', function() {
                const itemId = this.getAttribute('data-id');
                fetchDelete(itemId);
            });
        });
    }

    function fetchItemForEdit(id) {
        fetch(`http://localhost:8080/api/users/${id}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            }
        }).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        }).then(data => {
            const item = data.data;
            document.getElementById("editUsernameUser").value = item.username;
            document.getElementById("editForm").setAttribute("data-id", id);
            var editModal = new bootstrap.Modal(document.getElementById('editModal'));
            editModal.show();
        }).catch(error => {
            console.error("Error fetching item for edit:", error);
        });
    }

    function fetchDelete(id) {
        if (confirm("Apakah Anda yakin ingin menghapus user ini?")) {
            fetch(`http://localhost:8080/api/users/${id}`, {
                method: "DELETE",
                headers:{
                    "Authorization": `Bearer ${token}`
                }
            }).then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            }).then(data => {
                fetchAll();
            }).catch(err => {
                console.error("Error while deleting:", err);
                alert('Error while deleting the user. Please try again.');
            });
        }
    }

    window.onload = function() {
        fetchAll();
    };
</script>
</body>
</html>
