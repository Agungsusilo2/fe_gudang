<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 Unauthorized</title>
  <link rel="stylesheet" href="bootstrap-5.0.2-dist/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        .error-container {
            text-align: center;
            max-width: 90%;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .error-code {
            font-size: 4rem;
            font-weight: bold;
            color: #dc3545;
        }
        .error-message {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .back-button {
            font-size: 1rem;
        }
        @media (min-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            .error-message {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code">401</div>
    <div class="error-message">Unauthorized Access</div>
    <p class="text-muted">
        You do not have permission to view this page. Please log in or contact the administrator if you believe this is a mistake.
    </p>
    <a href="dashboard.html" class="btn btn-danger back-button m-2">Go to Homepage</a>
    <a href="login.html" class="btn btn-danger back-button">Go to Login</a>
</div>
</body>
</html>
